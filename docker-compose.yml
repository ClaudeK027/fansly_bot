# Deploiement Docker Compose pour le bot Fansly.
#
# Un seul service : container monolithique qui contient le worker + le
# dashboard Streamlit. Pour la justification de ce choix (vs 2 containers),
# voir docs/VPS_DEPLOY.md.
#
# Usage single-instance (legacy, comportement par defaut) :
#   docker compose up -d --build
#
# Usage multi-instance (variables INSTANCE_NAME, ENV_FILE, DATA_DIR, HOST_PORT) :
#   INSTANCE_NAME=marie ENV_FILE=.env.marie DATA_DIR=./data-marie HOST_PORT=8502 \
#     docker compose --project-name fansly-marie up -d --build
#
# Le script ./scripts/new-instance.sh NAME automatise tout cela.

services:
  fansly-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fansly-bot:latest
    # MULTI-INSTANCE : suffixe ajoute si INSTANCE_NAME defini, sinon "default"
    container_name: fansly-bot-${INSTANCE_NAME:-default}

    # Restart automatique apres un crash, un reboot du VPS, ou un kill OOM.
    # `unless-stopped` : ne relance PAS si on a explicitement fait
    # `docker compose stop` — utile pour les maintenances.
    restart: unless-stopped

    # Credentials Fansly (FANSLY_USERNAME, FANSLY_PASSWORD) charges depuis
    # ENV_FILE (default .env). Pour multi-instance, set ENV_FILE=.env.NAME.
    env_file:
      - ${ENV_FILE:-.env}

    # Override de AUTOSTART_WORKER si besoin (defaut true via entrypoint).
    # Decommente pour desactiver l autostart :
    # environment:
    #   AUTOSTART_WORKER: "false"

    # Bind mounts : tout l etat persistant vit dans DATA_DIR du host (default
    # ./data). Pour multi-instance, set DATA_DIR=./data-NAME pour isoler.
    # config.yaml en lecture seule : le code applicatif ne le modifie pas.
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ./config.yaml:/app/config.yaml:ro

    # Streamlit accessible sur 127.0.0.1 du VPS uniquement (pas d exposition
    # publique). Port host configurable via HOST_PORT (default 8501).
    # Acces via tunnel SSH : ssh -L 8501:localhost:${HOST_PORT} user@vps
    ports:
      - "127.0.0.1:${HOST_PORT:-8501}:8501"

    # Chromium a besoin d un /dev/shm assez grand pour eviter les crashes
    # "Out of memory" sur les pages lourdes (composer Fansly avec medias).
    # Defaut Docker : 64 Mo. On passe a 1 Go.
    shm_size: 1gb

    # tini comme PID 1 — reape les zombies si on a un kill brutal (cas du
    # bouton Forcer dans l UI qui SIGKILL le worker).
    init: true

    # Limite memoire raisonnable. Chromium + 2 publications en parallele
    # consomment ~1.5-2 Go. 3 Go de cap protege contre un leak runaway.
    # Ajuste si ton VPS a moins de RAM.
    mem_limit: 3g

    # Logs Docker : on garde les 10 derniers fichiers de 50 Mo pour eviter
    # de saturer le disque sur un VPS qui tourne des semaines.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
